<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>SignUp Page</title> 
<link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<style> 

    .error {
        color: red;
        visibility: hidden;
    }
    .error.visible {
        visibility: visible;
    }
    .success {
        color: green;
        visibility: hidden;
    }
    .success.visible {
        visibility: visible;
    }
    .requirements {
        font-size: 0.9em;
        color: #555;
    }
    .requirements ul {
        margin: 0;
        padding-left: 20px;
    }
</style>
</head>
<body>
    <div class="container">

        <h2>SignUp</h2>
        <form id='signUpForm' action="employee/register" method = "POST">
            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>      
            <div class="form-group">
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>  
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password"
                class="password-input"
                pattern="^(?=.*[0-9])(?=.*[!@#$%^&*])[a-zA-Z0-9!@#$%^&*]{5,}$"
                placeholder="Enter password"
                id="password" name="password" 
                required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            <br>
            <div class="requirements">
                Password must contain:
                <ul>
                    <li>At least 5 characters</li>
                    <li>At least one number (0-9)</li>
                    <li>At least one special character (!@#$%^&*)</li>
                </ul>
            </div>
            <span class="error" id="error">Passwords do not match</span>
            <button type="submit">Submit</button>
        </form>
    <script>
        const passwordField = document.getElementById('password');
        const confirmPasswordField = document.getElementById('confirmPassword');
        const error = document.getElementById('error');

        function checkPasswordMatch() {
            
            if (passwordField.value !== confirmPasswordField.value) {
                error.classList.add('visible');
            } else {
                error.classList.remove('visible');
            }
        }

        passwordField.addEventListener('input', checkPasswordMatch);
        confirmPasswordField.addEventListener('input', checkPasswordMatch);

        document.getElementById('signUpForm').addEventListener('submit', function(event) {
            
            if (passwordField.value !== confirmPasswordField.value) {
                error.classList.add('visible');
                alert('Password doesnt match!');
                event.preventDefault();

            } else {
                error.classList.remove('visible');
                // Uncomment the line below to redirect to the success page.
                //alert('Registration Successfull!! Please login now!!');

            }
        });
    </script>
</body>
</html>
